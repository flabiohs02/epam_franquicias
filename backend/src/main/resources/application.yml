server:
  port: 8080

spring:
  application:
    name: franquicias-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/franquicias_db}
      auto-index-creation: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.epam.franquicias: DEBUG
    org.springframework.data.mongodb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
